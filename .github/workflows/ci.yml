name: CI

on:
  push:
    branches: [main, desarrollo]
  pull_request:

jobs:
  servidor:
    name: Backend (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: colegio
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: clave-solo-para-ci-no-usar-en-produccion-0123456789abcdef
      DEBUG: "False"
      DB_NAME: colegio
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: servidor/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py test --parallel 4

  docente:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docente/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
